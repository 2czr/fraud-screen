<script>

(function() {
  var originalGet = axios?.get;
  if (originalGet) {
    axios.get = function(url) {
      if (url && url.includes('geo.datav.aliyun.com')) {

      return originalGet.apply(this, arguments);
    };
  }
})();
</script>
