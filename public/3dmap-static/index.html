<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="icon" href="./favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#000000"/><meta name="description" content="3D China Map"/><link rel="apple-touch-icon" href="./logo192.png"/><link rel="manifest" href="./manifest.json"/><title>3D地图</title>
<script>
(function() {
  var proxyBase = '/api/proxy?url=';
  function replaceUrl(url) {
    if (url && url.indexOf('geo.datav.aliyun.com') > -1) {
      return proxyBase + encodeURIComponent(url);
    }
    return url;
  }
  var XHR = XMLHttpRequest.prototype;
  var originalOpen = XHR.open;
  XHR.open = function(method, url) {
    arguments[1] = replaceUrl(url);
    return originalOpen.apply(this, arguments);
  };
  var originalFetch = window.fetch;
  window.fetch = function(input) {
    if (typeof input === 'string') {
      input = replaceUrl(input);
    } else if (input && input.url) {
      input.url = replaceUrl(input.url);
    }
    return originalFetch.apply(this, arguments);
  };
})();
</script>
