function hookAxios() {
  if (window.axios && !window._axiosHooked) {
    window._axiosHooked = true;
    var originalGet = window.axios.get;
    window.axios.get = function(url) {
      if (url && typeof url === 'string' && url.indexOf('geo.datav.aliyun.com') > -1) {
        url = window.PROXY_URL + encodeURIComponent(url);
      }
      return originalGet.apply(this, arguments);
    };
  }
}
var tid = setInterval(function() {
  hookAxios();
  if (window._axiosHooked) clearInterval(tid);
}, 100);
</script>
