<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div id="chart" style="width:600px;height:400px;"></div>
<textarea id="msg" rows="3" placeholder="分析图表"></textarea>
<button onclick="go()">发送</button>
<div id="result" style="margin-top:10px;padding:10px;border:1px solid #ccc;"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var myChart = echarts.init(document.getElementById('chart'));
  myChart.setOption({
    xAxis: { data: ['A','B','C','D'] },
    yAxis: {},
    series: [{ data: [10,20,30,40], type: 'bar' }]
  });
});

async function go() {
  try {
    let res = await axios.post('http://localhost:11434/api/generate', {
      model: "qwen2.5vl:3b", // ✅ 这里改成你实际的模型名
      prompt: document.getElementById('msg').value,
      stream: false
    });
    document.getElementById('result').innerText = res.data.response;
  } catch (error) {
    document.getElementById('result').innerText = "❌ 连接失败！检查 Ollama 是否启动";
    console.error(error);
  }
}
</script>
</body>
</html>
