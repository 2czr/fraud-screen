<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D中国地图 - GitHub风格</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html,body { width: 100%; height: 100%; overflow: hidden; background: #0a0e27; font-family: -apple-system,BlinkMacSystemFont,Microsoft YaHei,sans-serif; }
#root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "d3": "https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js",
    "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import * as d3 from 'd3';
import gsap from 'gsap';

// ================== 配置 ==================
const mapConfig = {
  mapDepth: 6,
  mapOpacity: 0.85,
  mapColor: '#1E6BF8',
  mapHoverColor: '#409EF9',
  mapColorGradient: ['#42A0F9', '#1E6BF8', '#0B388A', '#132354'],
  mapSideColor1: '#3F9FF3',
  mapSideColor2: '#266BF0',
  topLineColor: 0x41c0fb,
  topLineWidth: 3,
  label2dZIndex: 10,
  topLineZIndex: 8,
  spotZIndex: 6
};

// 诈骗数据
const fraudData = {
  '北京市':8200,'天津市':9600,'上海市':11000,'广东省':58000,'浙江省':21000,
  '江苏省':19000,'山东省':15000,'四川省':9000,'河南省':12800,'福建省':13000,
  '重庆市':36200,'湖南省':12900,'湖北省':10500,'河北省':9800,'陕西省':8700,
  '安徽省':7200,'辽宁省':6500,'江西省':5800,'广西壮族自治区':7600,'云南省':11200,
  '黑龙江省':4200,'吉林省':7600,'山西省':6300,'贵州省':5100,'内蒙古自治区':3800,
  '甘肃省':4500,'新疆维吾尔自治区':6800,'海南省':4200,'宁夏回族自治区':3100,
  '青海省':2600,'西藏自治区':1800
};

// ================== 初始化场景 ==================
const container = document.getElementById('root');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06092A);
scene.fog = new THREE.Fog(0x06092A, 100, 400);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, -50, 120);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0px';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 30;
controls.maxDistance = 250;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// ================== 光源 ==================
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(50, 50, 100);
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x00aaff, 0.6, 200);
pointLight.position.set(0, -30, 50);
scene.add(pointLight);

// ================== 地理投影 ==================
const projection = d3.geoMercator()
  .center([104, 36])
  .scale(35)
  .translate([0, 0]);

// ================== 创建省份3D模型 ==================
const mapGroup = new THREE.Group();
scene.add(mapGroup);

const provinceMeshes = [];

// 侧面着色器
const sideVertexShader = `
varying vec3 vPosition;
void main() {
  vPosition = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const sideFragmentShader = `
uniform vec3 color1;
uniform vec3 color2;
varying vec3 vPosition;
void main() {
  vec3 mixColor = mix(color1, color2, 0.5 - vPosition.z * 0.15);
  gl_FragColor = vec4(mixColor, 1.0);
}`;

function createProvinceMesh(polygon, name) {
  const value = fraudData[name] || Math.random() * 3000;
  const depth = mapConfig.mapDepth + (value / 60000) * 4;
  
  const shape = new THREE.Shape();
  polygon.forEach((point, i) => {
    const xy = projection(point);
    if (xy) {
      if (i === 0) shape.moveTo(xy[0], -xy[1]);
      else shape.lineTo(xy[0], -xy[1]);
    }
  });
  shape.closePath();
  
  if (shape.points.length < 3) return null;
  
  // 顶面材质
  const topMaterial = new THREE.MeshPhongMaterial({
    color: mapConfig.mapColorGradient[Math.floor(Math.random() * 4)],
    transparent: true,
    opacity: mapConfig.mapOpacity,
    side: THREE.DoubleSide
  });
  
  // 侧面材质 (着色器)
  const sideMaterial = new THREE.ShaderMaterial({
    uniforms: {
      color1: { value: new THREE.Color(mapConfig.mapSideColor1) },
      color2: { value: new THREE.Color(mapConfig.mapSideColor2) }
    },
    vertexShader: sideVertexShader,
    fragmentShader: sideFragmentShader
  });
  
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: depth,
    bevelEnabled: false
  });
  
  const mesh = new THREE.Mesh(geometry, [topMaterial, sideMaterial]);
  mesh.userData = { name, value, _color: topMaterial.color.getHex() };
  provinceMeshes.push(mesh);
  
  // 边框线
  const linePoints = [];
  polygon.forEach(point => {
    const xy = projection(point);
    if (xy) linePoints.push(xy[0], -xy[1], mapConfig.topLineZIndex);
  });
  
  if (linePoints.length > 6) {
    const lineGeometry = new LineGeometry();
    lineGeometry.setPositions(linePoints);
    const lineMaterial = new LineMaterial({
      color: mapConfig.topLineColor,
      linewidth: mapConfig.topLineWidth,
      resolution: new THREE.Vector2(window.innerWidth, window.innerHeight)
    });
    const line = new Line2(lineGeometry, lineMaterial);
    mapGroup.add(line);
  }
  
  return mesh;
}

function createProvinceLabel(centroid, name) {
  const xy = projection(centroid);
  if (!xy) return;
  
  const div = document.createElement('div');
  div.style.cssText = `
    color: #fff;
    font-size: 12px;
    padding: 4px 8px;
    background: rgba(6, 9, 42, 0.85);
    border: 1px solid #41c0fb;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
  `;
  div.textContent = name;
  
  const label = new CSS2DRenderer(div);
  label.position.set(xy[0], -xy[1], mapConfig.label2dZIndex);
  
  return label;
}

// ================== 雷达效果 ==================
function createRadar() {
  const radarGroup = new THREE.Group();
  
  for (let i = 0; i < 3; i++) {
    const size = 30 + i * 20;
    const geometry = new THREE.PlaneGeometry(size, size);
    const material = new THREE.MeshBasicMaterial({
      color: i === 0 ? 0x0A1E70 : 0x1E40A0,
      transparent: true,
      opacity: 0.4 - i * 0.1,
      side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.z = 0.5 + i * 0.1;
    radarGroup.add(mesh);
  }
  
  scene.add(radarGroup);
  
  return radarGroup;
}

const radar = createRadar();

// ================== 飞线效果 ==================
function createFlyLines(features) {
  const flyGroup = new THREE.Group();
  
  for (let i = 0; i < 5; i++) {
    const idx1 = Math.floor(Math.random() * features.length);
    let idx2 = Math.floor(Math.random() * features.length);
    while (idx1 === idx2) idx2 = Math.floor(Math.random() * features.length);
    
    const c1 = features[idx1].properties.centroid;
    const c2 = features[idx2].properties.centroid;
    if (!c1 || !c2) continue;
    
    const p1 = projection(c1);
    const p2 = projection(c2);
    if (!p1 || !p2) continue;
    
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(p1[0], -p1[1], mapConfig.spotZIndex),
      new THREE.Vector3((p1[0] + p2[0]) / 2, (-p1[1] - p2[1]) / 2, 20),
      new THREE.Vector3(p2[0], -p2[1], mapConfig.spotZIndex)
    );
    
    const lineGeometry = new THREE.BufferGeometry();
    const points = curve.getPoints(50);
    const positions = [];
    points.forEach(p => positions.push(p.x, p.y, p.z));
    lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    
    const lineMaterial = new THREE.LineBasicMaterial({
      color: 0x77f077,
      vertexColors: true
    });
    const line = new THREE.Line(lineGeometry, lineMaterial);
    flyGroup.add(line);
    
    // 飞行点
    const flyGeo = new THREE.SphereGeometry(0.3);
    const flyMat = new THREE.MeshBasicMaterial({ color: 0x77f077 });
    const fly = new THREE.Mesh(flyGeo, flyMat);
    fly.userData = { curve, t: 0, delay: i * 0.2 };
    flyGroup.add(fly);
  }
  
  scene.add(flyGroup);
  return flyGroup;
}

// ================== 加载地图数据 ==================
async function init() {
  try {
    const response = await fetch('https://geo.datav.aliyun.com/areas_v3/bound/geojson?code=100000_full');
    const geoJson = await response.json();
    
    geoJson.features.forEach(feature => {
      const name = feature.properties.name;
      const centroid = feature.properties.centroid;
      const type = feature.geometry.type;
      const coords = type === 'Polygon' ? feature.geometry.coordinates : feature.geometry.coordinates[0];
      
      coords.forEach(polygon => {
        const mesh = createProvinceMesh(polygon, name);
        if (mesh) mapGroup.add(mesh);
      });
      
      if (centroid) {
        const label = createProvinceLabel(centroid, name);
        if (label) mapGroup.add(label);
      }
    });
    
    // 居中
    const box = new THREE.Box3().setFromObject(mapGroup);
    const center = box.getCenter(new THREE.Vector3());
    mapGroup.position.sub(center);
    
    // 飞线
    const flyLines = createFlyLines(geoJson.features);
    
    // 动画循环
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      
      const elapsed = clock.getElapsedTime();
      
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      
      // 雷达动画
      radar.children.forEach((mesh, i) => {
        mesh.scale.x += 0.003;
        mesh.scale.y += 0.003;
        mesh.material.opacity -= 0.002;
        if (mesh.scale.x > 1.8 || mesh.material.opacity <= 0) {
          mesh.scale.set(1, 1, 1);
          mesh.material.opacity = 0.4 - i * 0.1;
        }
      });
      
      // 飞线动画
      flyLines.children.forEach(child => {
        if (child.userData.curve) {
          child.userData.t += 0.006;
          if (child.userData.t > 1) child.userData.t = 0;
          const pos = child.userData.curve.getPointAt(child.userData.t);
          child.position.copy(pos);
        }
      });
    }
    animate();
    
  } catch (error) {
    console.error('加载失败:', error);
  }
}

// ================== 鼠标交互 ==================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredMesh = null;

container.addEventListener('mousemove', event => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(provinceMeshes);
  
  if (intersects.length > 0) {
    const obj = intersects[0].object;
    if (obj.userData.name) {
      if (hoveredMesh !== obj) {
        if (hoveredMesh) hoveredMesh.material[0].color.setHex(hoveredMesh.userData._color);
        hoveredMesh = obj;
        hoveredMesh.userData._color = hoveredMesh.material[0].color.getHex();
        hoveredMesh.material[0].color.set(mapConfig.mapHoverColor);
      }
      container.style.cursor = 'pointer';
      controls.autoRotate = false;
    }
  } else {
    if (hoveredMesh) {
      hoveredMesh.material[0].color.setHex(hoveredMesh.userData._color);
      hoveredMesh = null;
    }
    container.style.cursor = 'default';
    controls.autoRotate = true;
  }
});

container.addEventListener('mouseleave', () => {
  controls.autoRotate = true;
});

// ================== 窗口调整 ==================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

// 启动
init();
</script>
</body>
</html>
